# Render "Blueprint" - connect this repo at https://dashboard.render.com/blueprints
# and Render will provision everything below automatically.
services:
  - type: web
    name: order-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "node scripts/migrate.js && node dist/server.js"
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: order-redis
          type: redis
          property: connectionString
      - key: PORT
        value: 3000

  - type: worker
    name: order-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/queue/orderWorker.js
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: order-redis
          type: redis
          property: connectionString

  - type: worker
    name: notification-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/queue/notificationWorker.js
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          name: order-redis
          type: redis
          property: connectionString

  - type: redis
    name: order-redis
    plan: free
    ipAllowList: []

databases:
  - name: order-db
    plan: free
