# Render "Blueprint" - connect this repo at https://dashboard.render.com/blueprints
# and Render will provision everything below automatically.
#
# Note: Render's free plan does not offer a free Background Worker service
# type (only Web Service, Postgres, and Key Value are free) - see
# https://docs.render.com/free. Running two paid workers just for a demo
# isn't worth it, so RUN_WORKERS_IN_PROCESS below runs both the order
# worker and the notification worker inside the same process as the API.
# If you upgrade order-api off the free plan, you can instead add back
# separate `type: worker` services (see the commented block at the bottom)
# and drop RUN_WORKERS_IN_PROCESS for a more production-shaped topology
# matching docker-compose.yml.
services:
  - type: web
    name: order-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "node scripts/migrate.js && node dist/server.js"
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: order-redis
          type: redis
          property: connectionString
      - key: PORT
        value: 3000
      - key: RUN_WORKERS_IN_PROCESS
        value: 'true'
      - key: ADMIN_API_KEY
        generateValue: true

  - type: redis
    name: order-redis
    plan: free
    ipAllowList: []

databases:
  - name: order-db
    plan: free

